name: ClinSight AI Production CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend1/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend1
          npm ci

      - name: Execute Node.js Unit Test Suite
        run: |
          cd backend1
          node --test tests/core.test.js
